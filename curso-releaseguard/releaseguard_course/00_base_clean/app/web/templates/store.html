<!doctype html><html><head><meta charset="utf-8"><title>ReleaseGuard Store</title><style>body{font-family:Arial;margin:40px;color:#222}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #ddd;border-radius:12px;padding:20px}.price{font-size:24px;font-weight:700}</style></head><body><h1>ReleaseGuard Store</h1><p data-scenario="{{ scenario }}">Catálogo de demonstração</p><div class="grid">{% for p in products %}<div class="card"><h2>{{p.name}}</h2><div class="price">R$ {{ '%.2f'|format(p.price) }}</div><p>Estoque: {{p.stock}}</p></div>{% endfor %}</div><p><a href="/store/checkout">Ir para checkout</a></p></body></html>
