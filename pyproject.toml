[project]
name = "opspilot-sandbox"
version = "0.1.0"
description = "Sistema base para agentes integrados a sistemas preexistentes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-ollama>=1.0",
  "langsmith>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
